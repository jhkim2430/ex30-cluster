<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<title>EX30 Cluster</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:#080a0d;
font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif
}

body{
display:flex;
align-items:center;
justify-content:center
}

.bezel{
width:100vw;
height:100vh;
background:#020304;
border:clamp(3px,.35vw,7px) solid #24272d;
border-radius:3.2vw;
padding:1.55vw;
display:flex;
align-items:center;
justify-content:center
}

.screen{
width:100%;
height:100%;
max-height:calc(100vh - 3.1vw);
border-radius:2.25vw;
overflow:hidden;
position:relative;
display:grid;
grid-template-columns:30% 46% 24%;
align-items:stretch;
background:linear-gradient(110deg,#f4f5f9 0%,#e8ebf2 48%,#f5f6fa 100%);
box-shadow:inset 0 0 30px #fff8
}

.left{
position:relative;
display:flex;
align-items:center;
justify-content:center;
border-right:1px solid #c9cdd5;
margin:14% 0 14%
}

.ready{
position:absolute;
top:-7%;
left:50%;
transform:translateX(-50%);
font-size:clamp(13px,1.5vw,25px);
font-weight:500;
color:#00a94f;
letter-spacing:.01em
}

.speedbox{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
margin-top:2%
}

.speed{
font-size:clamp(105px,10.5vw,210px);
font-weight:300;
line-height:.86;
letter-spacing:-.065em;
color:#050608;
font-variant-numeric:tabular-nums
}

.unit{
font-size:clamp(19px,2vw,39px);
color:#353b45;
margin-top:14px;
font-weight:400
}

.road-area{
position:relative;
overflow:hidden;
display:flex;
align-items:stretch;
justify-content:center;
background:#eef0f5
}

.road-scene{
display:block;
width:100%;
height:100%;
object-fit:cover;
object-position:center center;
transform:translate3d(0,0,0) scale(1);
will-change:transform;
transition:transform .35s cubic-bezier(.2,.65,.3,1)
}

.right{
display:grid;
grid-template-columns:1fr 18%;
align-items:center;
padding:0 0 0 10%;
position:relative
}

.clockbox{
display:flex;
align-items:center;
justify-content:center;
height:55%;
border-right:1px solid #c9cdd5
}

.time{
font-size:clamp(36px,4vw,78px);
font-weight:350;
letter-spacing:-.04em;
font-variant-numeric:tabular-nums;
color:#050608
}

.gears{
height:62%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:space-between;
padding:0 0 0 12%;
font-size:clamp(25px,2.5vw,48px);
font-weight:300;
color:#b0b5be
}

.gear{
width:100%;
text-align:center;
line-height:1.25
}

.gear.active{
color:#00a94f;
background:#d0d4dc;
border-radius:18px;
padding:2px 0
}

.gps{
position:absolute;
right:22%;
bottom:14%;
font-size:clamp(9px,.85vw,14px);
color:#777f8b;
white-space:nowrap
}

@media (orientation:portrait){

.bezel{
width:100vw;
height:100vh;
border-radius:5vw;
padding:2vw
}

.screen{
grid-template-columns:38% 38% 24%;
border-radius:3.5vw
}

.left{
margin:25% 0
}

.ready{
top:-13%;
font-size:13px
}

.speed{
font-size:clamp(68px,17vw,120px)
}

.unit{
font-size:17px;
margin-top:10px
}

.right{
grid-template-columns:1fr 22%;
padding-left:2%
}

.time{
font-size:clamp(22px,5vw,36px)
}

.gears{
font-size:clamp(17px,4vw,27px);
padding-left:4%
}

.gps{
right:20%;
bottom:9%;
font-size:8px
}
}
</style>
</head>

<body>

<div class="bezel">
<main class="screen">

<section class="left">
<div class="ready">READY</div>
<div class="speedbox">
<div class="speed" id="speed">0</div>
<div class="unit">km/h</div>
</div>
</section>

<section class="road-area">
<img class="road-scene" src="road-scene.png" alt="">
</section>

<section class="right">
<div class="clockbox">
<div class="time" id="time">21:45</div>
</div>

<div class="gears">
<div class="gear">R</div>
<div class="gear">N</div>
<div class="gear active">D</div>
</div>

<div class="gps" id="gps">GPS 연결 대기 중</div>
</section>

</main>
</div>

<script>
const speedEl=document.getElementById('speed');
const gpsEl=document.getElementById('gps');
const roadScene=document.querySelector('.road-scene');

function clock(){
document.getElementById('time').textContent=
new Intl.DateTimeFormat('ko-KR',{
hour:'2-digit',
minute:'2-digit',
hour12:false
}).format(new Date());
}

clock();
setInterval(clock,1000);

/* GPS 속도 */
let currentSpeed=0;
let targetSpeed=0;

if(navigator.geolocation){

navigator.geolocation.watchPosition(p=>{

const s=p.coords.speed;
targetSpeed=(s===null||!Number.isFinite(s))?0:s*3.6;

gpsEl.textContent='GPS ±'+Math.round(p.coords.accuracy)+'m';

},()=>{

gpsEl.textContent='GPS 권한 확인';

},{
enableHighAccuracy:true,
maximumAge:1000,
timeout:10000
});

}else{

gpsEl.textContent='GPS 사용 불가';

}

/* 부드러운 속도 변화 */

let lastFrame=performance.now();
let motionPhase=0;

function animate(now){

const dt=Math.min((now-lastFrame)/1000,.05);
lastFrame=now;

/* 속도 숫자 부드럽게 변화 */
currentSpeed+=(targetSpeed-currentSpeed)*(1-Math.exp(-dt*4));

const displayedSpeed=Math.round(currentSpeed);
speedEl.textContent=String(displayedSpeed);

/* 5km/h 미만 정지 */
const effectiveSpeed=Math.max(0,currentSpeed-5);

/* 움직임 강도 */
const intensity=Math.min(effectiveSpeed/100,1);

/* 속도에 따라 움직임 주기 증가 */
if(currentSpeed>5){

const frequency=.5+intensity*2.2;
motionPhase+=dt*frequency;

const vertical=Math.sin(motionPhase)*(.25+intensity*1.5);
const scale=1+intensity*.025;

roadScene.style.transform=
`translate3d(0,${vertical}%,0) scale(${scale})`;

}else{

motionPhase=0;
roadScene.style.transform='translate3d(0,0,0) scale(1)';

}

requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

/* 화면 꺼짐 방지 */

let wakeLock=null;

async function keepScreenAwake(){

if(!('wakeLock' in navigator) ||
document.visibilityState!=='visible')return;

try{

if(wakeLock)return;

wakeLock=await navigator.wakeLock.request('screen');

wakeLock.addEventListener('release',()=>{
wakeLock=null;
});

}catch(err){

wakeLock=null;
console.log('Screen Wake Lock unavailable:',err);

}
}

function releaseScreenAwake(){

if(wakeLock){

const lock=wakeLock;
wakeLock=null;
lock.release().catch(()=>{});

}
}

document.addEventListener('visibilitychange',()=>{

if(document.visibilityState==='visible'){
keepScreenAwake();
}else{
releaseScreenAwake();
}

});

window.addEventListener('pagehide',releaseScreenAwake);

keepScreenAwake();

/* 서비스 워커 */

if('serviceWorker' in navigator){

window.addEventListener('load',()=>{
navigator.serviceWorker.register('./sw.js');
});

}

</script>
</body>
</html>
